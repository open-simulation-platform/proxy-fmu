name: Upload Conan packages

env:
  CONAN_LOGIN_USERNAME_OSP: ${{ secrets.osp_artifactory_usr }}
  CONAN_PASSWORD_OSP: ${{ secrets.osp_artifactory_pwd }}
  CONAN_REVISIONS_ENABLED: 1
  CONAN_NON_INTERACTIVE: True

on: [push, workflow_dispatch]

jobs:
  linux:
    name: Linux
    runs-on: ${{matrix.os}}
    container:
      image: "gcc:${{ matrix.compiler_version }}-${{ matrix.distro }}"
    env:
      CC: gcc
      CXX: g++
      LIBCOSIM_RUN_TESTS_ON_CONAN_BUILD: "1"
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        build_type: [Debug, Release]
        compiler_libcxx: [libstdc++11]
        include:
          - compiler_version: 14
            distro: bookworm

    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake python3-pip
      - name: Install Conan
        uses: turtlebrowser/get-conan@main
      - name: Configure Conan
        run: |
          conan remote add osp https://osp.jfrog.io/artifactory/api/conan/conan-local --force
          conan profile detect --force
      - name: Conan create
        shell: bash
        run: |
          REFNAME="${GITHUB_REF#refs/*/}"
          VERSION="v$(<version.txt)"
          if [[ $GITHUB_REF == refs/tags/* ]] && [[ $REFNAME == $VERSION ]]; then CHANNEL="stable"
          elif [[ $REFNAME == master ]]; then CHANNEL="testing"
          else
            SHORT_REFNAME="${REFNAME:0:40}"
            CHANNEL="testing-${SHORT_REFNAME//\//_}"
          fi
          conan create \
            -s build_type=${{ matrix.build_type }} \
            -s compiler.version=${{ matrix.compiler_version }} \
            -s compiler.libcxx=${{ matrix.compiler_libcxx }} \
            -b missing \
            --update \
            --user=osp \
            --channel=${CHANNEL} \
            .
      - name: Conan upload
        run: conan upload --confirm --remote=osp '*'


  windows:
    name: Windows
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
        build_type: [Debug, Release]
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
      - name: Install Conan
        uses: turtlebrowser/get-conan@main
      - name: Configure Conan
        run:  |
          conan profile detect 
          conan remote add osp https://osp.jfrog.io/artifactory/api/conan/conan-local --force
      - name: Conan create
        shell: bash
        run: |
          REFNAME="${GITHUB_REF#refs/*/}"
          VERSION="v$(<version.txt)"
          if [[ $GITHUB_REF == refs/tags/* ]] && [[ $REFNAME == $VERSION ]]; then CHANNEL="stable"
          elif [[ $REFNAME == master ]]; then CHANNEL="testing"
          else
            SHORT_REFNAME="${REFNAME:0:40}"
            CHANNEL="testing-${SHORT_REFNAME//\//_}"
          fi
          conan create \
            -s build_type=${{ matrix.build_type }} \
            -b missing \
            --update \
            --user=osp \
            --channel=${CHANNEL} \
            .
      - name: Conan upload
        run: conan upload --confirm --remote osp '*'
